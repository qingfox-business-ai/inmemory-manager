server:
  port: 8080
  servlet:
    context-path: /inmemory-manager/inmemory-manager-service

spring:
  application:
    name: inmemory-manager-service
  config:
    import: "optional:nacos:inmemory-manager-service.yml"
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER:http://localhost:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      namespace: ${NACOS_NAMESPACE:}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_CONFIG_SERVER:${NACOS_SERVER:http://localhost:8848}}
        group: ${NACOS_CONFIG_GROUP:${NACOS_GROUP:DEFAULT_GROUP}}
        namespace: ${NACOS_CONFIG_NAMESPACE:${NACOS_NAMESPACE:}}
        cluster-name: ${NACOS_CONFIG_CLUSTER_NAME:${NACOS_CLUSTER_NAME:}}
        file-extension: ${NACOS_CONFIG_FILE_EXTENSION:yaml}
        username: ${NACOS_CONFIG_USERNAME:${NACOS_USERNAME:}}
        password: ${NACOS_CONFIG_PASSWORD:${NACOS_PASSWORD:}}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html