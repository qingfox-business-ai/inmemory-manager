version: '3'
services:
  inmemory-manager-inmemory-manager-service-backend:
    image: 10.126.126.2:50102/inmemory-manager/inmemory-manager-service
    build: .
    container_name: inmemory-manager-inmemory-manager-service-backend
    environment:
      - NACOS_CONFIG_ENABLED=true
      - NACOS_SERVER=http://10.126.126.2:58848
      - NACOS_GROUP=DEFAULT_GROUP
      - NACOS_NAMESPACE=local
      - NACOS_CLUSTER_NAME=
      - NACOS_CONFIG_FILE_EXTENSION=yaml
      - NACOS_USERNAME=nacos
      - NACOS_PASSWORD=nacos
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.inmemory-manager-inmemory-manager-service-secure.rule=Host(`10.126.126.2`) && PathPrefix(`/inmemory-manager/inmemory-manager-service`)"
networks:
  default:
    name: docker_network